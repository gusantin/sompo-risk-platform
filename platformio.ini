[platformio]
src_dir = firmware/src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; ESP32-D0WD-V3 confirmado via esptool em uma interface CP210x.
; A placa PlatformIO esp32dev preserva a configuração genérica compatível.
